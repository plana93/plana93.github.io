name: Fetch Google Scholar Data

on:
  # Run every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install scholarly requests

      - name: Fetch Scholar data
        run: |
          python _scripts/fetch_scholar.py
        timeout-minutes: 10

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet assets/data/scholar.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          git commit -m "data: auto-update Google Scholar publications [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "No changes to scholar.json — skipping commit."
